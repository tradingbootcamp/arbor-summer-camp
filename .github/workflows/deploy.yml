name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create .npmrc
        run: |
          echo "always-auth=true" > .npmrc
          echo "//npm.greensock.com/:_authToken=${{ secrets.GSAP_TOKEN }}" >> .npmrc
          echo "@gsap:registry=https://npm.greensock.com" >> .npmrc
          echo "Contents of .npmrc:"
          cat .npmrc

      - name: Install GSAP Business
        run: |
          pnpm add @gsap/business
          pnpm add gsap@npm:@gsap/business
        env:
          GSAP_TOKEN: ${{ secrets.GSAP_TOKEN }}

      - name: Install remaining dependencies
        run: pnpm install
        env:
          GSAP_TOKEN: ${{ secrets.GSAP_TOKEN }}

      - name: Build
        run: pnpm run build
        env:
          GSAP_TOKEN: ${{ secrets.GSAP_TOKEN }}
          PUBLIC_AIRTABLE_API_KEY: ${{ secrets.PUBLIC_AIRTABLE_API_KEY }}
          PUBLIC_AIRTABLE_BASE_ID: ${{ secrets.PUBLIC_AIRTABLE_BASE_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4